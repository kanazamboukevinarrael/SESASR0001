ekf_node_ext:
  ros__parameters:
    use_sim_time: false
    ekf_frequency: 20.0
    # EDIT: robot pose [x, y, yaw] in the LANDMARK MAP frame when you start the node
    initial_pose: [0.0, -1.5, 1.5708]
    initial_std: [0.2, 0.2, 0.2]
    initial_std_vel: [0.1, 0.1]
    std_lin_acc: 1.0               # [m/s^2]   process noise on v
    std_ang_acc: 3.0               # [rad/s^2] process noise on omega
    std_range: 0.05
    std_bearing: 0.05
    std_odom: [0.05, 0.10]         # wheel encoders: v [m/s], omega [rad/s]
    std_imu: 0.02                  # gyro: omega [rad/s]
    imu_topic: /imu                # EDIT if `ros2 topic list` shows another name
    landmarks_topic: /camera/landmarks
    landmarks_file: ''
    frame_id: map
